# DocAssistIQ — Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# The database URL is NOT stored here. It is read from the
# DOCASSISTIQ_DATABASE_URL environment variable (or .env file)
# inside migrations/env.py using app.config.get_settings().
# This prevents secrets from appearing in version control.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

version_path_separator = os

# Logging configuration — mirrors the application's log level.
# Alembic writes to stderr; we keep it concise for CI pipelines.
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
