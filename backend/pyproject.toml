[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # Allow assert in tests
    "S105",  # Allow string literals that look like passwords (bearer, HS256, etc.)
    "B008",  # Allow Depends() in function defaults (FastAPI's required pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S106"]  # Long strings and hardcoded test passwords are acceptable
"migrations/**" = ["E501"]     # Migration column comments may be long

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: requires a live PostgreSQL database (uses Docker stack)",
]
