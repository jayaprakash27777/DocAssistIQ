<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Definitions: ECG Grid Pattern -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#fed7d7" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#smallGrid)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#feb2b2" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#fff5f5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Clinical Monitor Header -->
  <rect x="0" y="0" width="800" height="45" fill="#1e293b"/>
  <text x="25" y="28" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">ECG MONITOR: 12-LEAD DIAGNOSTIC</text>
  <text x="360" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="12">Speed: 25mm/s | Gain: 10mm/mV | Filter: 0.05-150Hz</text>
  <text x="700" y="28" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">HR: 74 BPM</text>

  <!-- Lead V1 -->
  <g transform="translate(40, 90)">
    <text x="0" y="-10" fill="#475569" font-family="sans-serif" font-size="14" font-weight="bold">Lead V1</text>
    <path d="M 0,60 L 30,60 L 35,55 L 40,65 L 45,60 L 60,60 L 65,40 L 70,85 L 75,60 L 90,60 L 105,50 L 120,60 L 160,60 
             L 165,55 L 170,65 L 175,60 L 190,60 L 195,40 L 200,85 L 205,60 L 220,60 L 235,50 L 250,60 L 290,60"
          fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lead V2: Classic Wellens Type A Biphasic T-Wave (Positive deflection then deep negative inversion) -->
  <g transform="translate(400, 90)">
    <text x="0" y="-10" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">Lead V2 (Pathognomonic Biphasic T-Wave)</text>
    <path d="M 0,60 L 30,60 L 35,52 L 40,65 L 45,60 L 55,60 
             L 60,70 L 65,10 L 73,95 L 78,60 
             L 95,60 C 105,35 115,35 125,60 C 135,95 145,100 155,60 
             L 180,60 
             L 185,52 L 190,65 L 195,60 L 205,60 
             L 210,70 L 215,10 L 223,95 L 228,60 
             L 245,60 C 255,35 265,35 275,60 C 285,95 295,100 305,60 L 340,60"
          fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Annotation Arrow pointing to Wellens T wave -->
    <path d="M 140,130 L 140,105" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="132" width="160" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
    <text x="80" y="148" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="bold">Type A: Biphasic (+/-)</text>
  </g>

  <!-- Lead V3: Also Biphasic T-Wave -->
  <g transform="translate(40, 260)">
    <text x="0" y="-10" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">Lead V3 (Critical Proximal LAD Stenosis)</text>
    <path d="M 0,60 L 30,60 L 35,53 L 40,64 L 45,60 L 55,60 
             L 60,65 L 67,5 L 75,85 L 80,60 
             L 95,60 C 105,40 115,40 125,60 C 135,90 145,95 155,60 
             L 180,60 
             L 185,53 L 190,64 L 195,60 L 205,60 
             L 210,65 L 217,5 L 225,85 L 230,60 
             L 245,60 C 255,40 265,40 275,60 C 285,90 295,95 305,60 L 340,60"
          fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lead V4: Preserved R waves, subtle terminal inversion -->
  <g transform="translate(400, 260)">
    <text x="0" y="-10" fill="#475569" font-family="sans-serif" font-size="14" font-weight="bold">Lead V4 (Preserved Precordial R-Waves)</text>
    <path d="M 0,60 L 30,60 L 35,53 L 40,65 L 45,60 L 55,60 
             L 60,65 L 67,0 L 73,75 L 78,60 
             L 95,60 C 105,45 120,45 130,60 C 138,75 145,75 155,60 
             L 180,60 
             L 185,53 L 190,65 L 195,60 L 205,60 
             L 210,65 L 217,0 L 223,75 L 228,60 
             L 245,60 C 255,45 270,45 280,60 C 288,75 295,75 305,60 L 340,60"
          fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer Watermark & Calibration -->
  <rect x="0" y="415" width="800" height="35" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="438" fill="#64748b" font-family="sans-serif" font-size="11">Standard 1 mV Calibration: 10mm height</text>
  <rect x="250" y="420" width="10" height="25" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="438" fill="#059669" font-family="sans-serif" font-size="11" font-weight="bold">DocAssistIQ Verified Medical Imaging • HIPAA De-identified</text>
</svg>
