<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- Left: Transthoracic Echo showing dilated Coronary Artery -->
  <rect x="20" y="20" width="370" height="410" rx="12" fill="#020617" stroke="#1e293b"/>
  <!-- Ultrasound Sector Fan -->
  <path d="M 205,50 L 70,360 A 240 240 0 0 0 340 360 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Ultrasound Texture Rings -->
  <path d="M 120,240 A 150 150 0 0 0 290 240" fill="none" stroke="#1e293b" stroke-dasharray="3,6"/>
  <path d="M 90,300 A 200 200 0 0 0 320 300" fill="none" stroke="#1e293b" stroke-dasharray="3,6"/>
  <!-- Aortic Root & Proximal RCA Ectasia -->
  <circle cx="205" cy="210" r="35" fill="#020617" stroke="#64748b" stroke-width="3"/>
  <text x="205" y="215" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">Ao Root</text>
  <!-- Dilated RCA Lumen (Ectasia Z-Score +3.6) -->
  <path d="M 235,195 Q 285,185 305,210 Q 285,220 235,215 Z" fill="#ef4444" opacity="0.85"/>
  <path d="M 235,195 Q 285,185 305,210" fill="none" stroke="#f87171" stroke-width="3"/>
  
  <text x="40" y="55" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">PEDIATRIC TTE: CORONARY ARTERY</text>
  <text x="40" y="75" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">RCA Diameter: 4.8 mm (Z-Score +3.6)</text>
  <line x1="280" y1="180" x2="330" y2="130" stroke="#f87171" stroke-width="1.5"/>
  <rect x="250" y="100" width="130" height="28" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="315" y="118" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Early Ectasia Detected</text>

  <!-- Right: Oral Mucosa & Papillae (Strawberry Tongue Sign) -->
  <rect x="410" y="20" width="370" height="410" rx="12" fill="#1e1e2f" stroke="#2e2e48"/>
  <text x="430" y="55" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="bold">CLINICAL FINDING: OROPHARYNX</text>
  <text x="430" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="11">Classic Prominent Lingual Fungiform Papillae</text>

  <!-- Tongue Contour -->
  <path d="M 450,330 C 450,150 740,150 740,330 C 740,390 450,390 450,330 Z" fill="#e11d48"/>
  <path d="M 470,320 C 470,180 720,180 720,320 C 720,370 470,370 470,320 Z" fill="#be123c"/>

  <!-- Hypertrophied Red Papillae Dots (Strawberry Tongue) -->
  <g fill="#ffe4e6">
    <circle cx="530" cy="240" r="4"/><circle cx="560" cy="220" r="4.5"/><circle cx="595" cy="210" r="5"/>
    <circle cx="630" cy="220" r="4.5"/><circle cx="660" cy="240" r="4"/><circle cx="510" cy="270" r="4"/>
    <circle cx="545" cy="265" r="4.5"/><circle cx="595" cy="255" r="5.5"/><circle cx="645" cy="265" r="4.5"/>
    <circle cx="680" cy="270" r="4"/><circle cx="530" cy="300" r="4"/><circle cx="570" cy="300" r="5"/>
    <circle cx="620" cy="300" r="5"/><circle cx="660" cy="300" r="4"/><circle cx="595" cy="330" r="4.5"/>
  </g>

  <!-- Diagnostic Badge -->
  <rect x="430" y="375" width="330" height="38" rx="8" fill="#0f172a" stroke="#e11d48"/>
  <text x="595" y="398" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    Atypical Kawasaki Criteria Met (Day 6 of Remittent Fever)
  </text>
</svg>
