<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- Left: Histopathologic / Cutaneous Detachment Cross-Section -->
  <rect x="25" y="25" width="400" height="395" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="45" y="55" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="bold">DERMO-EPIDERMAL SEPARATION</text>
  <text x="45" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Full-Thickness Keratinocyte Apoptosis (TEN)</text>

  <!-- Stratum Corneum & Sloughing Epidermis -->
  <path d="M 50,140 Q 150,110 240,160 Q 320,100 400,130" fill="none" stroke="#fb7185" stroke-width="8"/>
  <!-- Detached Epidermal Flap (Nikolsky Sign Positive) -->
  <path d="M 120,130 Q 180,80 230,110 L 230,135 Q 180,105 120,130 Z" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <text x="180" y="75" fill="#e11d48" font-family="sans-serif" font-size="10" font-weight="bold">Nikolsky (+)</text>
  <line x1="180" y1="80" x2="180" y2="105" stroke="#e11d48" stroke-width="1.5"/>

  <!-- Subepidermal Bulla Fluid Pocket -->
  <path d="M 50,210 Q 150,160 240,210 Q 320,160 400,210 L 400,280 L 50,280 Z" fill="#fecdd3" opacity="0.3"/>
  <text x="210" y="245" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Subepidermal Cleavage Plane</text>

  <!-- Dermis with Papillary Edema -->
  <rect x="50" y="280" width="350" height="120" fill="#fda4af" opacity="0.4"/>
  <text x="225" y="340" fill="#9f1239" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Papillary & Reticular Dermis</text>
  <text x="225" y="360" fill="#be123c" font-family="sans-serif" font-size="10" text-anchor="middle">Spared from full necrosis (Contrast to Burns)</text>

  <!-- Right: SCORTEN Mortality Risk Table -->
  <rect x="445" y="25" width="330" height="395" rx="10" fill="#1e1e2f" stroke="#3730a3"/>
  <text x="470" y="55" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">SCORTEN ASSESSMENT (Score: 3)</text>
  <text x="470" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Predicted In-Hospital Mortality: 35.3%</text>

  <!-- Criteria Checklist -->
  <g font-family="sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="470" y="100" width="280" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="480" y="120" fill="#4ade80">✓ Age &gt; 40 years (Patient is 63M)</text>
    
    <rect x="470" y="140" width="280" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="480" y="160" fill="#4ade80">✓ TBSA Detachment &gt; 10% (40% TBSA)</text>

    <rect x="470" y="180" width="280" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="480" y="200" fill="#4ade80">✓ Serum Urea &gt; 10 mmol/L (11.8)</text>

    <rect x="470" y="220" width="280" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="480" y="240" fill="#94a3b8">✗ Heart Rate &gt; 120 bpm (HR is 92)</text>

    <rect x="470" y="260" width="280" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="480" y="280" fill="#94a3b8">✗ Underlying Malignancy (Negative)</text>
  </g>

  <!-- Pharmacogenetic Banner -->
  <rect x="470" y="320" width="280" height="75" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="485" y="345" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">PHARMACOGENETIC ALERT</text>
  <text x="485" y="365" fill="#fee2e2" font-family="sans-serif" font-size="10">Allopurinol contraindicated in HLA-B*58:01</text>
  <text x="485" y="380" fill="#f87171" font-family="sans-serif" font-size="10">CPIC Clinical Guideline Level A Evidence</text>
</svg>
